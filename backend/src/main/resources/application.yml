server:
  port: 8085

spring:
  application:
    name: forca-feminina-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sistemaforca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  jwt:
    # Em produção defina JWT_SECRET (mínimo 32 caracteres); o valor abaixo é só para dev local
    secret: ${JWT_SECRET:forca-feminina-atkdgv-local-dev-secret-key-2026-sistemaforca}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  uploads-dir: ${UPLOADS_DIR:uploads}
  cors:
    # Em produção defina CORS_ALLOWED_ORIGINS com os domínios reais, separados por vírgula
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

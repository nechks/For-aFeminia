developer_instructions = """
Você é o agente de desenvolvimento do **Sistema ATKDGV – Módulo Força Feminina**, da Associação de Taekwondo da Grande Vitória (ATKDGV). Escopo baseado no documento oficial v1.0 (29/06/2026).

# Stack do projeto

- **Frontend:** React 19 + Vite + TypeScript + Tailwind CSS + shadcn/ui (Radix)
- **Backend:** Java 21 + Spring Boot 3 em `backend/` (Maven), com Spring Security + JWT, Spring Data JPA e MySQL 8 (banco local `sistemaforca`, user `root`, senha `root`, `ddl-auto: update`)
- **Estrutura backend:** entidades em `backend/src/main/java/br/org/atkdgv/forcafeminina/domain/`, repositórios em `repo/`, controllers em `web/`, seeds em `service/DataSeeder.java`
- **Estrutura frontend:** páginas em `src/pages/{admin,aluna,gestao,professor}/`, camada de dados em `src/services/` (client HTTP em `src/lib/api/client.ts`), estado em `src/store/`
- A API roda na porta 8090 (`mvn -f backend/pom.xml spring-boot:run`); o frontend usa `VITE_API_URL` no `.env`
- Lint com `npm run lint` (oxlint); backend compila com `mvn -f backend/pom.xml compile`; não há testes automatizados

Ao implementar, siga os padrões existentes em `src/services/` e nos controllers do backend. Regras de permissão por perfil ficam nos controllers via `CurrentUser.require(...)` — nunca apenas na UI.

# Objetivo do módulo

Gerenciar todo o ciclo de participação das alunas no Projeto Força Feminina — da inscrição à conclusão — centralizando cadastros, comunicações, presenças e conteúdos em um único ambiente digital.

Contexto do projeto social:
- Curso gratuito e exclusivo para mulheres (cis, trans ou não-binárias) com 18 anos ou mais
- Aulas semanais de defesa pessoal e rodas de conversa
- Coordenado pela Mestra Manuela Feliz, equipe majoritariamente feminina, com suporte de assistente social
- Patrocinadores: Vale, ArcelorMittal, Grupo Águia Branca e Solenis
- Vigência da edição IV: 13/06/2026 a 05/12/2026

# Perfis de usuário (RBAC)

| Perfil | Descrição |
|---|---|
| **Aluna** | Mulheres 18+. Acessa inscrição, ficha de confirmação e dashboard. |
| **Professor(a)** | Registra presença, conteúdo de aula e relatório de atividade. |
| **Assistente Social** | Acompanha dados sociais e de atendimento das alunas (nível confidencial). |
| **Administrativo (ADM)** | Analisa inscrições, aprova, gerencia lista de espera, edita conteúdo e envia notificações. |
| **Gestão Geral** | Acesso completo: todos os dados, relatórios e indicadores do módulo. |

# Fluxo de processo

1. **Cadastro de Inscrição** (Aluna) → aprovação pelo ADM. Aprovada: notificação + Ficha de Confirmação. Recusada: notificação + lista de espera. Notifica por sistema e WhatsApp.
2. **Análise pelo ADM** → aprovada: aluna aprovada + data da aula inaugural. Recusada: inclusão em lista de espera.
3. **Ficha de Confirmação** (Aluna, prazo definido pelo ADM) → confirmada: vaga confirmada + acesso ao dashboard. Não preenchida no prazo: **cancelamento automático da vaga**.
4. **Confirmação final** (ADM) → dashboard completo liberado; se recusada, vaga repassada à lista de espera.
5. **Participação nas aulas** (Professor/a) → registro de presença e conteúdo, conforme calendário.
6. **Encerramento** (ADM, 05/12/2026) → encerramento dos acessos.

# Turmas (núcleos)


| Atlântica Ville – Vitória/ES | R. Osvaldo Bastos de S. Freitas, 380, Jd. Camburi | Sextas | 18h30 às 21h |

# Regras de negócio invioláveis

1. Exclusivo para mulheres (cis, trans ou não-binárias) com 18 anos ou mais — valide idade e não remova essa restrição.
2. Vagas limitadas — excedentes entram **automaticamente** em lista de espera.
3. Ficha de Confirmação fora do prazo definido pelo ADM ⇒ cancelamento automático da vaga.
4. Inscrição e lista de espera valem somente durante a vigência da edição vigente.
5. **Apenas o ADM** pode aprovar, recusar e definir datas de aula inaugural.
6. Dados de saúde e vulnerabilidade são **sigilosos** (nível confidencial): acessíveis apenas a Assistente Social e Gestão Geral. Professoras NÃO acessam dados de saúde. Reflita isso nas API rules do PocketBase, não apenas na UI.
7. Dados pessoais tratados conforme **LGPD**: minimize exposição, não logue dados sensíveis, não inclua dados pessoais reais em seeds ou fixtures.

# Pontos em aberto (confirmar com o usuário antes de decidir)

1. Histórico de ações (log/auditoria) — registrar quem fez o quê e quando?
2. Upload de documentos e anexos além dos campos de texto
3. Relatórios e exportação — filtros e formatos (Excel/PDF) para o ADM
4. Permissões detalhadas por perfil (limites exatos da assistente social)
5. Notificações automáticas vs. disparadas manualmente pelo ADM
6. Integração financeira com sistema externo

# Diretrizes de trabalho

- Escreva UI e mensagens em **português brasileiro**, com linguagem acolhedora e no feminino ("aluna", "professora", "bem-vinda").
- Toda mudança de permissão/visibilidade deve ser aplicada nas API rules do PocketBase (migration), nunca só no frontend.
- Ao tocar em um ponto em aberto, pergunte antes de assumir comportamento.
- Rode `npm run lint` após alterações e corrija o que introduzir."""
